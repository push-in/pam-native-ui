name: Device E2E

# Every component and event on an Android emulator: the showcase is built
# with this checkout of pam-native-ui, then tools/e2e_android.py drives it,
# checks the geometry of every state (tools/geometry.py), compares goldens
# (tests/golden/android, tools/golden.py) and fails on any app warning or
# error in logcat (tools/zero_errors.py).

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      record_goldens:
        description: Record goldens instead of comparing (uploaded as an artifact)
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  android:
    name: Android API 36 components, events, geometry and goldens
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android build dependencies
        run: sdkmanager "platforms;android-36" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Install PAM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # github.com release downloads answer 403 now and then on hosted runners.
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 15 -o /tmp/pam-install.sh \
            https://github.com/push-in/pam/releases/latest/download/install.sh
          # The installer asks the anonymous GitHub API for the latest tag, which
          # hosted runners hit the rate limit of: resolve it with the job token.
          PAM_VERSION=$(gh release view -R push-in/pam --json tagName -q .tagName)
          export PAM_VERSION
          for attempt in 1 2 3; do sh /tmp/pam-install.sh && break; [ "$attempt" = 3 ] && exit 1; sleep 30; done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Resolve the showcase with this checkout
        id: resolve
        working-directory: examples/showcase
        run: |
          # This checkout stands in for the released package (any 2.x satisfies ^2.0).
          pam composer config repositories.ui '{"type":"path","url":"../..","options":{"symlink":false,"versions":{"pushinbr/pam-native-ui":"2.99.0"}}}'
          pam composer update --no-interaction --no-progress
          native=$(pam composer show pushinbr/pam-native --format=json | python3 -c 'import json, sys; print(json.load(sys.stdin)["versions"][0])')
          echo "pam-native=$native" >> "$GITHUB_OUTPUT"
          # The Gradle home pam mobile build uses: cached below, keyed on
          # the pam-native version (its Android project pins every plugin).
          echo "PAM_NATIVE_GRADLE_HOME=$HOME/.pam-native-gradle" >> "$GITHUB_ENV"

      # Gradle dependencies come from the cache, not from Maven Central on
      # every run: on 2026-11-19 Central answered 404 ("Could not find
      # org.jetbrains.kotlin:kotlin-stdlib:2.3.0", asm 9.9, ...) to two
      # hosted runners in a row (run 44459661709, attempts 2 and 3).
      - name: Restore the Gradle dependency cache
        id: gradle-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.pam-native-gradle/caches/modules-2
            ~/.pam-native-gradle/wrapper/dists
          key: pam-gradle-${{ runner.os }}-${{ steps.resolve.outputs.pam-native }}
          restore-keys: pam-gradle-${{ runner.os }}-

      - name: Build the showcase
        working-directory: examples/showcase
        run: |
          # Google's mirror of Maven Central, after the project's own
          # repositories: a module Central does not serve (404) is looked
          # up there instead of failing the build.
          mkdir -p "$PAM_NATIVE_GRADLE_HOME/init.d"
          cat > "$PAM_NATIVE_GRADLE_HOME/init.d/central-mirror.gradle" <<'GRADLE'
          def centralMirror = 'https://maven-central.storage-download.googleapis.com/maven2/'
          settingsEvaluated { settings ->
              settings.pluginManagement.repositories.maven { name = 'MavenCentralMirror'; url = centralMirror }
              settings.dependencyResolutionManagement.repositories.maven { name = 'MavenCentralMirror'; url = centralMirror }
          }
          GRADLE
          pam mobile build . --abi x86_64
          find dist -name '*.apk' | head -1 > /tmp/apk-path

      # Saved right after a successful build (not at the end of the job, which
      # a golden difference may fail), and only a complete resolution: a
      # failed build never stores a cache.
      - name: Save the Gradle dependency cache
        if: steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.pam-native-gradle/caches/modules-2
            ~/.pam-native-gradle/wrapper/dists
          key: pam-gradle-${{ runner.os }}-${{ steps.resolve.outputs.pam-native }}

      - name: Enable KVM
        run: |
          sudo usermod -aG kvm "$USER"
          sudo chmod 666 /dev/kvm

      - name: Drive every component on the emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r "examples/showcase/$(cat /tmp/apk-path)"
            adb logcat -c
            mkdir -p /tmp/shots
            python3 -m pip install --quiet --user --break-system-packages pillow
            python3 tools/e2e_android.py --serial emulator-5554 --shots /tmp/shots --golden tests/golden/android ${{ inputs.record_goldens && '--update-golden' || '' }}
            python3 tools/zero_errors.py logcat --serial emulator-5554

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-e2e
          path: |
            /tmp/shots
            /tmp/pam-golden-*
            tests/golden/android
