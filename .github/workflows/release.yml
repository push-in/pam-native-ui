name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to publish
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  PAM_NATIVE_COMMIT: 647dcbdd8610c0b210c00cb04fcfedf2ff6d4b01

jobs:
  ios:
    name: Build iOS release artifact
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - uses: actions/checkout@v7
        with:
          repository: push-in/pam-native
          ref: ${{ env.PAM_NATIVE_COMMIT }}
          path: pam-native
      - name: Test and build UIKit package
        env:
          PAM_NATIVE_IOS_PATH: ${{ github.workspace }}/pam-native/ios
        run: |
          udid=$(
            xcrun simctl list devices available |
              awk -F '[()]' '/iPhone/ { print $2; exit }'
          )
          test -n "${udid}"
          xcodebuild \
            -scheme PamMobileUi \
            -destination "platform=iOS Simulator,id=${udid}" \
            CODE_SIGNING_ALLOWED=NO \
            test
          xcodebuild \
            -scheme PamMobileUi \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Create versioned iOS archive
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          version=${RELEASE_TAG#v}
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent ios \
            "dist/pam-mobile-ui-ios-${version}.zip"
          shasum -a 256 "dist/pam-mobile-ui-ios-${version}.zip" \
            >"dist/pam-mobile-ui-ios-${version}.zip.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: pam-mobile-ui-ios-release
          path: dist/pam-mobile-ui-ios-*
          if-no-files-found: error

  package:
    name: Build release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - uses: actions/checkout@v7
        with:
          repository: push-in/pam-native
          ref: ${{ env.PAM_NATIVE_COMMIT }}
          path: pam-native
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - name: Validate release version and package
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          tools/distribution-package.sh validate-tag "${RELEASE_TAG}"
          composer install \
            --working-dir=tools/phpstan \
            --no-interaction \
            --no-progress \
            --prefer-dist
          PAM_NATIVE_ROOT="${GITHUB_WORKSPACE}/pam-native" composer run verify
      - name: Build Android release AAR
        run: >-
          pam-native/android/gradlew
          -p android
          -PpamNativeRoot=${{ github.workspace }}/pam-native
          assembleRelease
      - name: Create reproducible release archives
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          version=${RELEASE_TAG#v}
          mkdir -p dist
          cp android/build/outputs/aar/pam-mobile-ui-release.aar \
            "dist/pam-mobile-ui-android-${version}.aar"
          git archive \
            --format=tar \
            --prefix="pam-mobile-ui-${version}/" \
            --output="dist/pam-mobile-ui-php-${version}.tar" \
            HEAD
          gzip -n "dist/pam-mobile-ui-php-${version}.tar"
          (
            cd dist
            sha256sum \
              "pam-mobile-ui-android-${version}.aar" \
              "pam-mobile-ui-php-${version}.tar.gz" \
              >SHA256SUMS
          )
      - uses: actions/attest-build-provenance@v4
        if: github.event.repository.visibility == 'public'
        with:
          subject-path: |
            dist/*.aar
            dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: pam-mobile-ui-release
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs:
      - ios
      - package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pam-mobile-ui-release
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: pam-mobile-ui-ios-release
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
          overwrite_files: true
