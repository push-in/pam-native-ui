name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to publish
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  PAM_NATIVE_COMMIT: 26a768c9a7e0137bda9fa7de23f46c9308de2839

jobs:
  ecosystem-compatibility:
    name: Certify the complete PAM Native ecosystem
    uses: push-in/pam/.github/workflows/ecosystem-compatibility.yml@main

  android-minimum:
    name: Android / PAM Native minimum
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - uses: actions/checkout@v7
        with:
          repository: push-in/pam-native
          ref: 3a94047c54632d3c3ff998bcd9ca75e70aec58b0
          path: pam-native
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Compile, test and lint the minimum native boundary
        run: >-
          pam-native/android/gradlew
          -p android
          -PpamNativeRoot=${{ github.workspace }}/pam-native
          testDebugUnitTest
          lintDebug
          assembleRelease

  ios-minimum:
    name: iOS / PAM Native minimum
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - uses: actions/checkout@v7
        with:
          repository: push-in/pam-native
          ref: 3a94047c54632d3c3ff998bcd9ca75e70aec58b0
          path: pam-native
      - name: Test and build against the minimum UIKit boundary
        env:
          PAM_NATIVE_IOS_PATH: ${{ github.workspace }}/pam-native/ios
        run: |
          udid=$(
            xcrun simctl list devices available |
              awk -F '[()]' '/iPhone/ { print $2; exit }'
          )
          test -n "${udid}"
          xcodebuild \
            -scheme PamMobileUi \
            -destination "platform=iOS Simulator,id=${udid}" \
            CODE_SIGNING_ALLOWED=NO \
            test
          xcodebuild \
            -scheme PamMobileUi \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  ios:
    name: Build iOS release artifact
    needs: ecosystem-compatibility
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - uses: actions/checkout@v7
        with:
          repository: push-in/pam-native
          ref: ${{ env.PAM_NATIVE_COMMIT }}
          path: pam-native
      - name: Test and build UIKit package
        env:
          PAM_NATIVE_IOS_PATH: ${{ github.workspace }}/pam-native/ios
        run: |
          udid=$(
            xcrun simctl list devices available |
              awk -F '[()]' '/iPhone/ { print $2; exit }'
          )
          test -n "${udid}"
          xcodebuild \
            -scheme PamMobileUi \
            -destination "platform=iOS Simulator,id=${udid}" \
            CODE_SIGNING_ALLOWED=NO \
            test
          xcodebuild \
            -scheme PamMobileUi \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Create and verify reproducible iOS archive
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          version=${RELEASE_TAG#v}
          mkdir -p dist
          first="${RUNNER_TEMP}/pam-mobile-ui-ios-first.zip"
          second="${RUNNER_TEMP}/pam-mobile-ui-ios-second.zip"
          tools/reproducible-archive.sh zip HEAD ios ios/ "${first}"
          tools/reproducible-archive.sh zip HEAD ios ios/ "${second}"
          cmp "${first}" "${second}"
          cp "${first}" "dist/pam-mobile-ui-ios-${version}.zip"
          python3 benchmarks/package/reproducibility.py \
            --pair "1=${first}=${second}" \
            --output "dist/pam-mobile-ui-ios-${version}.reproducibility.json"
          python3 benchmarks/package/gate.py \
            --artifact "1=dist/pam-mobile-ui-ios-${version}.zip" \
            --output "dist/pam-mobile-ui-ios-${version}.package-budget.json"
          (
            cd dist
            sha256sum "pam-mobile-ui-ios-${version}.zip" \
              >"pam-mobile-ui-ios-${version}.zip.sha256"
          )
      - uses: actions/attest-build-provenance@v4
        if: github.event.repository.visibility == 'public'
        with:
          subject-path: |
            dist/*.zip
            dist/*.package-budget.json
            dist/*.reproducibility.json
      - uses: actions/upload-artifact@v7
        with:
          name: pam-mobile-ui-ios-release
          path: dist/pam-mobile-ui-ios-*
          if-no-files-found: error
          retention-days: 7

  composer-compatibility:
    name: PHP ${{ matrix.php }} / PAM Native ${{ matrix.graph }}
    needs:
      - ios
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.4'
          - '8.5'
        graph:
          - lowest
          - latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Preflight dependency graph
        run: |
          arguments=(--no-interaction --no-progress --prefer-dist)
          if [[ '${{ matrix.graph }}' == lowest ]]; then
            arguments+=(--prefer-lowest --prefer-stable)
          fi
          composer update "${arguments[@]}" --dry-run
          composer install \
            --working-dir=tools/phpstan \
            --no-interaction \
            --no-progress \
            --prefer-dist \
            --dry-run
      - name: Resolve and verify dependency graph
        env:
          PAM_NATIVE_ROOT: ${{ github.workspace }}/vendor/pushinbr/pam-native
          PAM_CI_VERIFIED_GATES: ios
        run: |
          arguments=(--no-interaction --no-progress --prefer-dist)
          if [[ '${{ matrix.graph }}' == lowest ]]; then
            arguments+=(--prefer-lowest --prefer-stable)
          fi
          composer update "${arguments[@]}"
          composer install \
            --working-dir=tools/phpstan \
            --no-interaction \
            --no-progress \
            --prefer-dist
          composer validate --strict --no-check-publish
          composer show pushinbr/pam-native --format=json
          composer run verify

  package:
    name: Build release artifacts
    needs:
      - android-minimum
      - composer-compatibility
      - ecosystem-compatibility
      - ios
      - ios-minimum
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - uses: actions/checkout@v7
        with:
          repository: push-in/pam-native
          ref: ${{ env.PAM_NATIVE_COMMIT }}
          path: pam-native
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - name: Validate release version and package
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          PAM_CI_VERIFIED_GATES: ios
        run: |
          tools/distribution-package.sh validate-tag "${RELEASE_TAG}"
          composer install \
            --no-interaction \
            --no-progress \
            --prefer-dist \
            --dry-run
          composer install \
            --working-dir=tools/phpstan \
            --no-interaction \
            --no-progress \
            --prefer-dist \
            --dry-run
          composer install \
            --no-interaction \
            --no-progress \
            --prefer-dist
          composer install \
            --working-dir=tools/phpstan \
            --no-interaction \
            --no-progress \
            --prefer-dist
          PAM_NATIVE_ROOT="${GITHUB_WORKSPACE}/pam-native" composer run verify
      - name: Build and verify reproducible Android AAR
        run: |
          first="${RUNNER_TEMP}/pam-mobile-ui-android-first.aar"
          second="${RUNNER_TEMP}/pam-mobile-ui-android-second.aar"
          pam-native/android/gradlew \
            -p android \
            -PpamNativeRoot="${GITHUB_WORKSPACE}/pam-native" \
            clean assembleRelease
          cp android/build/outputs/aar/pam-mobile-ui-release.aar "${first}"
          pam-native/android/gradlew \
            -p android \
            -PpamNativeRoot="${GITHUB_WORKSPACE}/pam-native" \
            clean assembleRelease
          cp android/build/outputs/aar/pam-mobile-ui-release.aar "${second}"
          cmp "${first}" "${second}"
      - name: Create and verify reproducible PHP archive
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          version=${RELEASE_TAG#v}
          mkdir -p dist
          cp android/build/outputs/aar/pam-mobile-ui-release.aar \
            "dist/pam-mobile-ui-android-${version}.aar"
          first="${RUNNER_TEMP}/pam-mobile-ui-php-first.tar.gz"
          second="${RUNNER_TEMP}/pam-mobile-ui-php-second.tar.gz"
          tools/reproducible-archive.sh tar.gz HEAD . \
            "pam-mobile-ui-${version}/" "${first}"
          tools/reproducible-archive.sh tar.gz HEAD . \
            "pam-mobile-ui-${version}/" "${second}"
          cmp "${first}" "${second}"
          cp "${first}" "dist/pam-mobile-ui-php-${version}.tar.gz"
          python3 benchmarks/package/reproducibility.py \
            --pair "2=${RUNNER_TEMP}/pam-mobile-ui-android-first.aar=${RUNNER_TEMP}/pam-mobile-ui-android-second.aar" \
            --pair "3=${first}=${second}" \
            --output "dist/pam-mobile-ui-${version}.reproducibility.json"
          python3 benchmarks/package/gate.py \
            --artifact "2=dist/pam-mobile-ui-android-${version}.aar" \
            --artifact "3=dist/pam-mobile-ui-php-${version}.tar.gz" \
            --output "dist/pam-mobile-ui-${version}.package-budget.json"
          (
            cd dist
            sha256sum \
              "pam-mobile-ui-android-${version}.aar" \
              "pam-mobile-ui-php-${version}.tar.gz" \
              >SHA256SUMS
          )
      - uses: actions/attest-build-provenance@v4
        if: github.event.repository.visibility == 'public'
        with:
          subject-path: |
            dist/*.aar
            dist/*.package-budget.json
            dist/*.tar.gz
            dist/*.reproducibility.json
      - uses: actions/upload-artifact@v7
        with:
          name: pam-mobile-ui-release
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs:
      - ios
      - package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - uses: actions/download-artifact@v8
        with:
          name: pam-mobile-ui-release
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: pam-mobile-ui-ios-release
          path: dist
      - name: Verify downloaded release artifacts
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          sha256sum --check pam-mobile-ui-ios-*.zip.sha256
          cd ..
          version=${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          version=${version#v}
          python3 benchmarks/package/reproducibility.py \
            --artifact "1=dist/pam-mobile-ui-ios-${version}.zip" \
            --verify-report "dist/pam-mobile-ui-ios-${version}.reproducibility.json"
          python3 benchmarks/package/reproducibility.py \
            --artifact "2=dist/pam-mobile-ui-android-${version}.aar" \
            --artifact "3=dist/pam-mobile-ui-php-${version}.tar.gz" \
            --verify-report "dist/pam-mobile-ui-${version}.reproducibility.json"
          python3 benchmarks/package/gate.py \
            --artifact "1=dist/pam-mobile-ui-ios-${version}.zip" \
            --verify-report "dist/pam-mobile-ui-ios-${version}.package-budget.json"
          python3 benchmarks/package/gate.py \
            --artifact "2=dist/pam-mobile-ui-android-${version}.aar" \
            --artifact "3=dist/pam-mobile-ui-php-${version}.tar.gz" \
            --verify-report "dist/pam-mobile-ui-${version}.package-budget.json"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
          overwrite_files: true
