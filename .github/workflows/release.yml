name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to publish
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  PAM_NATIVE_COMMIT: 4c7d0174a3c4cb368fcaf3e3a33357816c9c5b90

jobs:
  ecosystem-compatibility:
    name: Certify the complete PAM Native ecosystem
    uses: push-in/pam/.github/workflows/ecosystem-compatibility.yml@main

  android-minimum:
    name: Android / PAM Native minimum
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - uses: actions/checkout@v7
        with:
          repository: push-in/pam-native
          ref: a09b9216b1153c53081d9cbef9ae786177b61d33
          path: pam-native
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Compile, test and lint the minimum native boundary
        run: >-
          pam-native/android/gradlew
          -p android
          -PpamNativeRoot=${{ github.workspace }}/pam-native
          testDebugUnitTest
          lintDebug
          assembleRelease
      - name: Remove regenerable build artifacts
        if: always()
        run: scripts/cleanup-build-artifacts.sh

  ios-minimum:
    name: iOS / PAM Native minimum
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - uses: actions/checkout@v7
        with:
          repository: push-in/pam-native
          ref: a09b9216b1153c53081d9cbef9ae786177b61d33
          path: pam-native
      - name: Test and build against the minimum UIKit boundary
        env:
          PAM_NATIVE_IOS_PATH: ${{ github.workspace }}/pam-native/ios
        run: |
          udid=$(
            xcrun simctl list devices available |
              awk -F '[()]' '/iPhone/ { print $2; exit }'
          )
          test -n "${udid}"
          xcodebuild \
            -scheme PamMobileUi \
            -derivedDataPath "${GITHUB_WORKSPACE}/.build/DerivedData" \
            -destination "platform=iOS Simulator,id=${udid}" \
            CODE_SIGNING_ALLOWED=NO \
            test
          xcodebuild \
            -scheme PamMobileUi \
            -derivedDataPath "${GITHUB_WORKSPACE}/.build/DerivedData" \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Remove regenerable build artifacts
        if: always()
        run: scripts/cleanup-build-artifacts.sh

  ios:
    name: Build iOS release artifact
    needs: ecosystem-compatibility
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - uses: actions/checkout@v7
        with:
          repository: push-in/pam-native
          ref: ${{ env.PAM_NATIVE_COMMIT }}
          path: pam-native
      - name: Test and build UIKit package
        env:
          PAM_NATIVE_IOS_PATH: ${{ github.workspace }}/pam-native/ios
        run: |
          udid=$(
            xcrun simctl list devices available |
              awk -F '[()]' '/iPhone/ { print $2; exit }'
          )
          test -n "${udid}"
          xcodebuild \
            -scheme PamMobileUi \
            -derivedDataPath "${GITHUB_WORKSPACE}/.build/DerivedData" \
            -destination "platform=iOS Simulator,id=${udid}" \
            CODE_SIGNING_ALLOWED=NO \
            test
          xcodebuild \
            -scheme PamMobileUi \
            -derivedDataPath "${GITHUB_WORKSPACE}/.build/DerivedData" \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Create and verify reproducible iOS archive
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          version=${RELEASE_TAG#v}
          mkdir -p dist
          first="${RUNNER_TEMP}/pam-mobile-ui-ios-first.zip"
          second="${RUNNER_TEMP}/pam-mobile-ui-ios-second.zip"
          tools/reproducible-archive.sh zip HEAD ios ios/ "${first}"
          tools/reproducible-archive.sh zip HEAD ios ios/ "${second}"
          cmp "${first}" "${second}"
          cp "${first}" "dist/pam-mobile-ui-ios-${version}.zip"
          python3 benchmarks/package/reproducibility.py \
            --pair "1=${first}=${second}" \
            --output "dist/pam-mobile-ui-ios-${version}.reproducibility.json"
          python3 benchmarks/package/gate.py \
            --artifact "1=dist/pam-mobile-ui-ios-${version}.zip" \
            --output "dist/pam-mobile-ui-ios-${version}.package-budget.json"
          (
            cd dist
            sha256sum "pam-mobile-ui-ios-${version}.zip" \
              >"pam-mobile-ui-ios-${version}.zip.sha256"
          )
      - uses: actions/attest-build-provenance@v4
        if: github.event.repository.visibility == 'public'
        with:
          subject-path: |
            dist/*.zip
            dist/*.package-budget.json
            dist/*.reproducibility.json
      - uses: actions/upload-artifact@v7
        with:
          name: pam-mobile-ui-ios-release
          path: dist/pam-mobile-ui-ios-*
          if-no-files-found: error
          retention-days: 7
      - name: Remove regenerable build artifacts
        if: always()
        run: scripts/cleanup-build-artifacts.sh

  composer-compatibility:
    name: PHP ${{ matrix.php }} / PAM Native ${{ matrix.graph }}
    needs:
      - ios
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.5'
        graph:
          - lowest
          - latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Preflight dependency graph
        run: |
          arguments=(--no-interaction --no-progress --prefer-dist)
          if [[ '${{ matrix.graph }}' == lowest ]]; then
            arguments+=(--prefer-lowest --prefer-stable)
          fi
          composer update "${arguments[@]}" --dry-run
          composer install \
            --working-dir=tools/phpstan \
            --no-interaction \
            --no-progress \
            --prefer-dist \
            --dry-run
      - name: Resolve and verify dependency graph
        env:
          PAM_NATIVE_ROOT: ${{ github.workspace }}/vendor/pushinbr/pam-native
          PAM_CI_VERIFIED_GATES: ios
        run: |
          arguments=(--no-interaction --no-progress --prefer-dist)
          if [[ '${{ matrix.graph }}' == lowest ]]; then
            arguments+=(--prefer-lowest --prefer-stable)
          fi
          composer update "${arguments[@]}"
          composer install \
            --working-dir=tools/phpstan \
            --no-interaction \
            --no-progress \
            --prefer-dist
          composer validate --strict --no-check-publish
          composer show pushinbr/pam-native --format=json
          composer run verify
      - name: Remove regenerable build artifacts
        if: always()
        run: scripts/cleanup-build-artifacts.sh

  package:
    name: Build release artifacts
    needs:
      - android-minimum
      - composer-compatibility
      - ecosystem-compatibility
      - ios
      - ios-minimum
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - uses: actions/checkout@v7
        with:
          repository: push-in/pam-native
          ref: ${{ env.PAM_NATIVE_COMMIT }}
          path: pam-native
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
      - name: Validate release version and package
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          PAM_CI_VERIFIED_GATES: ios
        run: |
          tools/distribution-package.sh validate-tag "${RELEASE_TAG}"
          composer install \
            --no-interaction \
            --no-progress \
            --prefer-dist \
            --dry-run
          composer install \
            --working-dir=tools/phpstan \
            --no-interaction \
            --no-progress \
            --prefer-dist \
            --dry-run
          composer install \
            --no-interaction \
            --no-progress \
            --prefer-dist
          composer install \
            --working-dir=tools/phpstan \
            --no-interaction \
            --no-progress \
            --prefer-dist
          PAM_NATIVE_ROOT="${GITHUB_WORKSPACE}/pam-native" composer run verify
      - name: Verify checked-in physical-device evidence
        run: |
          python3 -m unittest discover -s benchmarks -p 'test_*device_evidence.py'
          python3 -m json.tool benchmarks/device-evidence.schema.json >/dev/null
          python3 benchmarks/verify-device-evidence.py benchmarks/android-*.json
      - name: Build and verify reproducible Android AAR
        run: |
          first="${RUNNER_TEMP}/pam-mobile-ui-android-first.aar"
          second="${RUNNER_TEMP}/pam-mobile-ui-android-second.aar"
          pam-native/android/gradlew \
            -p android \
            -PpamNativeRoot="${GITHUB_WORKSPACE}/pam-native" \
            clean assembleRelease
          cp android/build/outputs/aar/pam-native-ui-release.aar "${first}"
          pam-native/android/gradlew \
            -p android \
            -PpamNativeRoot="${GITHUB_WORKSPACE}/pam-native" \
            clean assembleRelease
          cp android/build/outputs/aar/pam-native-ui-release.aar "${second}"
          cmp "${first}" "${second}"
      - name: Create and verify reproducible PHP archive
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          version=${RELEASE_TAG#v}
          mkdir -p dist
          cp android/build/outputs/aar/pam-native-ui-release.aar \
            "dist/pam-mobile-ui-android-${version}.aar"
          first="${RUNNER_TEMP}/pam-mobile-ui-php-first.tar.gz"
          second="${RUNNER_TEMP}/pam-mobile-ui-php-second.tar.gz"
          tools/reproducible-archive.sh tar.gz HEAD . \
            "pam-mobile-ui-${version}/" "${first}"
          tools/reproducible-archive.sh tar.gz HEAD . \
            "pam-mobile-ui-${version}/" "${second}"
          cmp "${first}" "${second}"
          cp "${first}" "dist/pam-mobile-ui-php-${version}.tar.gz"
          python3 benchmarks/package/reproducibility.py \
            --pair "2=${RUNNER_TEMP}/pam-mobile-ui-android-first.aar=${RUNNER_TEMP}/pam-mobile-ui-android-second.aar" \
            --pair "3=${first}=${second}" \
            --output "dist/pam-mobile-ui-${version}.reproducibility.json"
          python3 benchmarks/package/gate.py \
            --artifact "2=dist/pam-mobile-ui-android-${version}.aar" \
            --artifact "3=dist/pam-mobile-ui-php-${version}.tar.gz" \
            --output "dist/pam-mobile-ui-${version}.package-budget.json"
          (
            cd dist
            sha256sum \
              "pam-mobile-ui-android-${version}.aar" \
              "pam-mobile-ui-php-${version}.tar.gz" \
              >SHA256SUMS
          )
      - uses: actions/attest-build-provenance@v4
        if: github.event.repository.visibility == 'public'
        with:
          subject-path: |
            dist/*.aar
            dist/*.package-budget.json
            dist/*.tar.gz
            dist/*.reproducibility.json
      - uses: actions/upload-artifact@v7
        with:
          name: pam-mobile-ui-release
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      - name: Remove regenerable build artifacts
        if: always()
        run: scripts/cleanup-build-artifacts.sh

  community-first-run:
    name: Create and run every clean community starter
    needs:
      - package
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - uses: actions/checkout@v7
        with:
          repository: push-in/pam-native-ui
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          path: pam-native-ui-candidate
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: push-in/pam
          ref: main
          path: pam-cli
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: push-in/pam-native
          ref: 4c7d0174a3c4cb368fcaf3e3a33357816c9c5b90
          path: pam-native-candidate
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Assemble the candidate PAM entrypoint and public runtime payload
        run: |
          installer="${RUNNER_TEMP}/pam-install.sh"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 120 --max-filesize 1048576 \
            --retry 5 --retry-delay 3 --retry-max-time 180 \
            --retry-all-errors \
            -fsSL \
            --output "${installer}" \
            https://github.com/push-in/pam/releases/latest/download/install.sh
          test -s "${installer}"
          sh -n "${installer}"
          sh "${installer}"
          test -x "${HOME}/.local/bin/pam"
          pam_launcher=$(readlink -f "${HOME}/.local/bin/pam")
          pam_install_root=$(cd "$(dirname "${pam_launcher}")/.." && pwd)
          pam_home="${pam_install_root}/share/pam"
          test -f "${pam_home}/runtime/catalog.json"
          PHP_CONFIG=$(command -v php-config) cargo build --locked --release \
            --manifest-path pam-cli/Cargo.toml --bin pam
          cargo build --locked --release \
            --manifest-path pam-native-candidate/Cargo.toml \
            --package pam-native-cli
          test -x pam-cli/target/release/pam
          test -x pam-native-candidate/target/release/pam-native
          printf 'PAM_BIN=%s\n' "${GITHUB_WORKSPACE}/pam-cli/target/release/pam" >>"${GITHUB_ENV}"
          printf 'PAM_HOME=%s\n' "${pam_home}" >>"${GITHUB_ENV}"
          printf 'PAM_NATIVE_HOME=%s\n' "${GITHUB_WORKSPACE}/pam-native-candidate" >>"${GITHUB_ENV}"
          printf 'PAM_NATIVE_PACKAGE_PATH=%s\n' \
            "${GITHUB_WORKSPACE}/pam-native-candidate/packages/native" >>"${GITHUB_ENV}"
          printf 'PAM_NATIVE_CLI=%s\n' \
            "${GITHUB_WORKSPACE}/pam-native-candidate/target/release/pam-native" >>"${GITHUB_ENV}"
      - name: Prove every documented pam init and pam dev journey
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PAM_HOME: ${{ env.PAM_HOME }}
          PAM_NATIVE_HOME: ${{ env.PAM_NATIVE_HOME }}
          PAM_NATIVE_PACKAGE_PATH: ${{ env.PAM_NATIVE_PACKAGE_PATH }}
          PAM_NATIVE_CLI: ${{ env.PAM_NATIVE_CLI }}
          PAM_MOBILE_UI_PACKAGE_PATH: ${{ github.workspace }}/pam-native-ui-candidate
          PAM_COMMUNITY_GATE_TIMEOUT_SECONDS: '1200'
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: pam-cli/scripts/community-experience-gate.sh all
      - name: Remove regenerable build artifacts
        if: always()
        run: scripts/cleanup-build-artifacts.sh

  publish:
    name: Publish GitHub release
    needs:
      - ecosystem-compatibility
      - ios
      - package
      - community-first-run
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - uses: actions/download-artifact@v8
        with:
          name: pam-mobile-ui-release
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: pam-mobile-ui-ios-release
          path: dist
      - name: Verify downloaded release artifacts
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          sha256sum --check pam-mobile-ui-ios-*.zip.sha256
          cd ..
          version=${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          version=${version#v}
          python3 benchmarks/package/reproducibility.py \
            --artifact "1=dist/pam-mobile-ui-ios-${version}.zip" \
            --verify-report "dist/pam-mobile-ui-ios-${version}.reproducibility.json"
          python3 benchmarks/package/reproducibility.py \
            --artifact "2=dist/pam-mobile-ui-android-${version}.aar" \
            --artifact "3=dist/pam-mobile-ui-php-${version}.tar.gz" \
            --verify-report "dist/pam-mobile-ui-${version}.reproducibility.json"
          python3 benchmarks/package/gate.py \
            --artifact "1=dist/pam-mobile-ui-ios-${version}.zip" \
            --verify-report "dist/pam-mobile-ui-ios-${version}.package-budget.json"
          python3 benchmarks/package/gate.py \
            --artifact "2=dist/pam-mobile-ui-android-${version}.aar" \
            --artifact "3=dist/pam-mobile-ui-php-${version}.tar.gz" \
            --verify-report "dist/pam-mobile-ui-${version}.package-budget.json"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
          overwrite_files: true
