name: Verify

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  PAM_NATIVE_COMMIT: 0b519d6ece2ee33251a37ff3fe370fbdc3bb8030

jobs:
  php:
    name: PHP 8.4
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout PAM Mobile UI
        uses: actions/checkout@v7

      - name: Checkout the certified PAM Native revision
        uses: actions/checkout@v7
        with:
          repository: push-in/pam-native
          ref: ${{ env.PAM_NATIVE_COMMIT }}
          path: pam-native

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2

      - name: Install locked analysis tools
        run: >-
          composer install
          --working-dir=tools/phpstan
          --no-interaction
          --no-progress
          --prefer-dist

      - name: Validate package
        run: composer validate --strict --no-check-publish

      - name: Verify generated API, styles and PHP
        env:
          PAM_NATIVE_ROOT: ${{ github.workspace }}/pam-native
        run: composer run verify

      - name: Run composition benchmark
        env:
          PAM_NATIVE_ROOT: ${{ github.workspace }}/pam-native
        run: composer run benchmark

  android:
    name: Android unit, lint and AAR
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout PAM Mobile UI
        uses: actions/checkout@v7

      - name: Checkout the certified PAM Native revision
        uses: actions/checkout@v7
        with:
          repository: push-in/pam-native
          ref: ${{ env.PAM_NATIVE_COMMIT }}
          path: pam-native

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Unit tests, lint and release archive
        run: >-
          pam-native/android/gradlew
          -p android
          -PpamNativeRoot=${{ github.workspace }}/pam-native
          testDebugUnitTest
          lintDebug
          assembleRelease

      - uses: actions/upload-artifact@v7
        with:
          name: pam-mobile-ui-android
          path: |
            android/build/outputs/aar/pam-mobile-ui-release.aar
            android/build/reports/lint-results-debug.html
            android/build/test-results/testDebugUnitTest/
          if-no-files-found: error

  ios:
    name: iOS UIKit package and tests
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout PAM Mobile UI
        uses: actions/checkout@v7

      - name: Checkout the certified PAM Native revision
        uses: actions/checkout@v7
        with:
          repository: push-in/pam-native
          ref: ${{ env.PAM_NATIVE_COMMIT }}
          path: pam-native

      - name: Test PAM Mobile UI on an iOS Simulator
        env:
          PAM_NATIVE_IOS_PATH: ${{ github.workspace }}/pam-native/ios
        run: |
          udid=$(
            xcrun simctl list devices available |
              awk -F '[()]' '/iPhone/ { print $2; exit }'
          )
          test -n "${udid}"
          xcodebuild \
            -scheme PamMobileUi \
            -destination "platform=iOS Simulator,id=${udid}" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build PAM Mobile UI for the iOS Simulator
        env:
          PAM_NATIVE_IOS_PATH: ${{ github.workspace }}/pam-native/ios
        run: >-
          xcodebuild
          -scheme PamMobileUi
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

  instrumented:
    name: Android API ${{ matrix.api-level }} behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level:
          - 26
          - 36
    steps:
      - name: Checkout PAM Mobile UI
        uses: actions/checkout@v7

      - name: Checkout the certified PAM Native revision
        uses: actions/checkout@v7
        with:
          repository: push-in/pam-native
          ref: ${{ env.PAM_NATIVE_COMMIT }}
          path: pam-native

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Enable KVM
        run: |
          sudo usermod -aG kvm "$USER"
          sudo chmod 666 /dev/kvm

      - name: Run behavioral tests on Android
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: >-
            pam-native/android/gradlew
            -p android
            -PpamNativeRoot=${{ github.workspace }}/pam-native
            connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=dev.pam.mobileui.MobileUiHostInstrumentedTest

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pam-mobile-ui-api-${{ matrix.api-level }}-tests
          path: |
            android/build/reports/androidTests/connected/
            android/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
