name: Verify

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  PAM_NATIVE_COMMIT: 4997e3912329b3c2e4b4e6df1eecfc04eeee8189

jobs:
  composer-compatibility:
    name: PHP ${{ matrix.php }} / PAM Native ${{ matrix.graph }}
    needs:
      - ios
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.5'
        graph:
          - lowest
          - latest
    steps:
      - name: Checkout PAM Native UI
        uses: actions/checkout@v7

      - name: Checkout the PAM Native 1.0 candidate
        uses: actions/checkout@v7
        with:
          repository: push-in/pam-native
          ref: ${{ env.PAM_NATIVE_COMMIT }}
          path: pam-native

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Preflight dependency graph
        run: |
          composer config repositories.pam-native-candidate \
            '{"type":"path","url":"pam-native/packages/native","options":{"symlink":false,"versions":{"pushinbr/pam-native":"1.0.0"}}}'
          arguments=(--no-interaction --no-progress --prefer-dist)
          if [[ '${{ matrix.graph }}' == lowest ]]; then
            arguments+=(--prefer-lowest --prefer-stable)
          fi
          composer update "${arguments[@]}" --dry-run
          composer install \
            --working-dir=tools/phpstan \
            --no-interaction \
            --no-progress \
            --prefer-dist \
            --dry-run

      - name: Resolve dependency graph
        run: |
          arguments=(--no-interaction --no-progress --prefer-dist)
          if [[ '${{ matrix.graph }}' == lowest ]]; then
            arguments+=(--prefer-lowest --prefer-stable)
          fi
          composer update "${arguments[@]}"
          composer install \
            --working-dir=tools/phpstan \
            --no-interaction \
            --no-progress \
            --prefer-dist

      - name: Verify installed PAM Native graph
        env:
          PAM_NATIVE_ROOT: ${{ github.workspace }}/vendor/pushinbr/pam-native
          PAM_CI_VERIFIED_GATES: ios
        run: |
          composer validate --strict --no-check-publish
          composer show pushinbr/pam-native --format=json
          composer run verify

  php:
    name: PHP 8.5
    needs:
      - ios
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout PAM Native UI
        uses: actions/checkout@v7

      - name: Checkout the certified PAM Native revision
        uses: actions/checkout@v7
        with:
          repository: push-in/pam-native
          ref: ${{ env.PAM_NATIVE_COMMIT }}
          path: pam-native

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
          tools: composer:v2

      - name: Install locked analysis tools
        run: >-
          composer install
          --working-dir=tools/phpstan
          --no-interaction
          --no-progress
          --prefer-dist

      - name: Install package dependencies
        run: |
          composer config repositories.pam-native-candidate \
            '{"type":"path","url":"pam-native/packages/native","options":{"symlink":false,"versions":{"pushinbr/pam-native":"1.0.0"}}}'
          composer install --no-interaction --no-progress --prefer-dist

      - name: Validate package
        run: composer validate --strict --no-check-publish

      - name: Verify generated API, styles and PHP
        env:
          PAM_NATIVE_ROOT: ${{ github.workspace }}/pam-native
          PAM_CI_VERIFIED_GATES: ios
        run: composer run verify

      - name: Test release evidence
        run: |
          python3 -m unittest discover -s benchmarks/package -p 'test_*.py'
          python3 -m unittest discover -s benchmarks -p 'test_*device_evidence.py'
          python3 -m json.tool benchmarks/device-evidence.schema.json >/dev/null
          python3 benchmarks/verify-device-evidence.py benchmarks/android-*.json

      - name: Run composition benchmark
        env:
          PAM_NATIVE_ROOT: ${{ github.workspace }}/pam-native
        run: composer run benchmark

  android:
    name: Android / PAM Native ${{ matrix.native.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        native:
          - label: minimum
            commit: 4997e3912329b3c2e4b4e6df1eecfc04eeee8189
          - label: current
            commit: 4997e3912329b3c2e4b4e6df1eecfc04eeee8189
    steps:
      - name: Checkout PAM Native UI
        uses: actions/checkout@v7

      - name: Checkout the certified PAM Native revision
        uses: actions/checkout@v7
        with:
          repository: push-in/pam-native
          ref: ${{ matrix.native.commit }}
          path: pam-native

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Unit tests, lint and release archive
        run: >-
          pam-native/android/gradlew
          -p android
          -PpamNativeRoot=${{ github.workspace }}/pam-native
          testDebugUnitTest
          lintDebug
          assembleRelease

      - uses: actions/upload-artifact@v7
        with:
          name: pam-mobile-ui-android-${{ matrix.native.label }}
          path: |
            android/build/outputs/aar/pam-native-ui-release.aar
            android/build/reports/lint-results-debug.html
            android/build/test-results/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS / PAM Native ${{ matrix.native.label }}
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        native:
          - label: minimum
            commit: cde29febd6f1ffbeff10e3b16f0a20e094ee3476
          - label: current
            commit: cde29febd6f1ffbeff10e3b16f0a20e094ee3476
    steps:
      - name: Checkout PAM Native UI
        uses: actions/checkout@v7

      - name: Checkout the certified PAM Native revision
        uses: actions/checkout@v7
        with:
          repository: push-in/pam-native
          ref: ${{ matrix.native.commit }}
          path: pam-native

      - name: Test PAM Native UI on an iOS Simulator
        env:
          PAM_NATIVE_IOS_PATH: ${{ github.workspace }}/pam-native/ios
        run: |
          udid=$(
            xcrun simctl list devices available |
              awk -F '[()]' '/iPhone/ { print $2; exit }'
          )
          test -n "${udid}"
          xcodebuild \
            -scheme PamMobileUi \
            -destination "platform=iOS Simulator,id=${udid}" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build PAM Native UI for the iOS Simulator
        env:
          PAM_NATIVE_IOS_PATH: ${{ github.workspace }}/pam-native/ios
        run: >-
          xcodebuild
          -scheme PamMobileUi
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

  instrumented:
    name: Android API ${{ matrix.api-level }} behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level:
          - 26
          - 36
    steps:
      - name: Checkout PAM Native UI
        uses: actions/checkout@v7

      - name: Checkout the certified PAM Native revision
        uses: actions/checkout@v7
        with:
          repository: push-in/pam-native
          ref: ${{ env.PAM_NATIVE_COMMIT }}
          path: pam-native

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Enable KVM
        run: |
          sudo usermod -aG kvm "$USER"
          sudo chmod 666 /dev/kvm

      - name: Run behavioral tests on Android
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: >-
            pam-native/android/gradlew
            -p android
            -PpamNativeRoot=${{ github.workspace }}/pam-native
            connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=dev.pam.mobileui.MobileUiHostInstrumentedTest

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pam-mobile-ui-api-${{ matrix.api-level }}-tests
          path: |
            android/build/reports/androidTests/connected/
            android/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 7
